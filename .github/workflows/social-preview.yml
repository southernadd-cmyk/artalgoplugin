name: Artwork-specific Open Graph previews
on:
  pull_request:
    branches: [main]
    paths:
      - 'share-preview.mjs'
      - 'server.mjs'
      - 'preview-source-server.mjs'
      - 'scripts/sync-preview-source.mjs'
      - 'scripts/make-fast-preview.mjs'
      - 'tests/local-image-preview.test.mjs'
      - 'package.json'
      - 'tests/social-preview.test.mjs'
      - '.github/workflows/social-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-card:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build-mirror exact ALGO/ART renderer
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check safe routes, MCP server and static snapshot
        run: |
          node --check server.mjs
          node --check share-preview.mjs
          node --check preview-source-server.mjs
          node --check scripts/sync-preview-source.mjs
          node --check scripts/make-fast-preview.mjs
          node --test tests/social-preview.test.mjs
      - name: Render actual Oil painting to shareable JPEG without GitHub Pages
        run: node --test --test-concurrency=1 tests/local-image-preview.test.mjs
