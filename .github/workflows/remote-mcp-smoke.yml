name: Remote MCP smoke test
on:
  push:
    paths:
      - .github/workflows/remote-mcp-smoke.yml
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 35 https://algoart-composition-plugin.onrender.com/health -o health.json; then
              cat health.json
              node -e "const h=require('./health.json');if(h.status!=='ok')process.exit(1)"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: MCP initialize
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -X POST https://algoart-composition-plugin.onrender.com/mcp \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"plugin-smoke-test","version":"1.0"}}}' -o initialize.json
          node -e "const d=require('./initialize.json');console.log(d.result?.serverInfo||d);if(d.error||!d.result)process.exit(1)"
      - name: MCP list tools
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -X POST https://algoart-composition-plugin.onrender.com/mcp \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' -o tools.json
          node -e "const d=require('./tools.json');const n=(d.result?.tools||[]).map(x=>x.name);console.log(n);if(!n.includes('show_composition_picker')||!n.includes('get_composition_guide'))process.exit(1)"
      - name: Generate three genuine composition previews
        run: |
          curl --fail --silent --show-error --max-time 180 \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -X POST https://algoart-composition-plugin.onrender.com/mcp \
            -d '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"show_composition_picker","arguments":{"subject":"A fridge full of food"}}}' -o picker.json
          node -e "const d=require('./picker.json');const r=d.result?.structuredContent;console.log({error:d.result?.content?.[0]?.text,guideCount:r?.guides?.length,modes:r?.guides?.map(x=>x.mode),imagePrefixes:r?.guides?.map(x=>x.preview?.slice(0,22))});if(!r||r.guides.length!==3||!r.guides.every(x=>x.preview.startsWith('data:image/png;base64,')))process.exit(1)"
