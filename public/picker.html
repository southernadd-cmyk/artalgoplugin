<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;padding:14px;color:var(--color-text-primary,#222);background:var(--color-background-primary,#fff)}
h2{font-size:17px;margin:0 0 6px}p{color:var(--color-text-secondary,#666);font-size:12px;margin:0 0 14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.choice{border:1px solid #aaa;border-radius:9px;background:var(--color-background-secondary,#fff);color:inherit;overflow:hidden;text-align:left;padding:0;cursor:pointer}.choice:focus-visible,.choice.selected{outline:3px solid var(--color-text-primary,#222)}.choice img{width:100%;display:block;aspect-ratio:7/5;background:#fff;object-fit:contain}
.choice span{display:block;font-size:11px;padding:6px}.choice small{font-size:10px;color:var(--color-text-secondary,#666);overflow-wrap:anywhere}
label{display:block;font-size:12px;font-weight:650;margin:12px 0 5px}textarea{width:100%;min-height:56px;padding:8px;font:13px system-ui;border:1px solid #aaa;border-radius:7px;resize:vertical}button.primary{margin-top:9px;background:var(--color-text-primary,#222);color:var(--color-background-primary,#fff);border:0;border-radius:8px;padding:11px 14px;cursor:pointer;font-weight:700;width:100%}button:disabled{opacity:.55;cursor:default}#status{font-size:12px;margin-top:9px;min-height:20px;color:var(--color-text-secondary,#666)}footer{font-size:10px;color:var(--color-text-secondary,#666);margin-top:10px}
</style></head><body>
<h2>ALGO/ART · Composition</h2>
<p>Choose one of three compositions generated by the original ALGO/ART V6 engine. The empty areas matter as much as the marks.</p>
<div class="grid" id="choices"></div>
<form id="form"><label for="subject">What should ChatGPT paint or draw?</label><textarea id="subject" maxlength="600" placeholder="An oil painting of a fridge full of food"></textarea><button id="submit" class="primary" disabled>Use composition in ChatGPT</button></form>
<div id="status" aria-live="polite">Select a composition above.</div>
<footer>Original algorithms: <a href="https://southernadd-cmyk.github.io/algoart/" target="_blank" rel="noopener noreferrer">ALGO/ART</a> · Spatial fidelity and negative space prioritized</footer>
<script>
(function(){
let data=null,selected=null,busy=false;
const el=id=>document.getElementById(id);
function show(){
  const d=window.openai?.toolOutput;
  if(!d||!Array.isArray(d.guides))return;
  data=d;selected=null;el('subject').value=d.subject||'';el('choices').replaceChildren();el('submit').disabled=true;
  for(const g of d.guides){
    const b=document.createElement('button');b.type='button';b.className='choice';b.setAttribute('aria-pressed','false');
    const im=document.createElement('img');im.src=g.preview;im.alt='Original ALGO/ART '+g.title+' composition guide';
    const lbl=document.createElement('span');const strong=document.createElement('strong');strong.textContent=g.title;const sm=document.createElement('small');sm.textContent=' / '+g.seed;lbl.append(strong,sm);b.append(im,lbl);
    b.onclick=()=>{selected=g;for(const c of el('choices').children){c.classList.remove('selected');c.setAttribute('aria-pressed','false');}b.classList.add('selected');b.setAttribute('aria-pressed','true');el('submit').disabled=false;el('status').textContent='Selected '+g.title+'. The guide will organise visual weight and space without acting as a clipping mask.'};
    el('choices').append(b);
  }
}
show();window.addEventListener('openai:set_globals',show);
el('form').onsubmit=async e=>{
  e.preventDefault();if(!selected||busy)return;
  const subject=el('subject').value.trim()||'An expressive oil painting';
  if(!window.openai?.sendFollowUpMessage){el('status').textContent='Your ChatGPT client cannot send the selection automatically.';return;}
  busy=true;el('submit').disabled=true;el('status').textContent='Requesting the full-size original composition PNG in ChatGPT…';
  const instruction='Use ALGO/ART · Composition. Call get_composition_guide using mode '+JSON.stringify(selected.mode)+', seed '+JSON.stringify(selected.seed)+' and subject '+JSON.stringify(subject)+'. Then generate the user-requested image using the ACTUAL returned PNG as an underlying compositional reference, NOT a stencil or clipping mask. Preserve focal hierarchy, visual balance, approximate positions and relative scale of major forms, directional flow, and significant negative space. Interpret guide marks as visual masses, not separate containers. Let figures and objects overlap, merge, or extend beyond marks to make a coherent complete scene. Do not crop subjects into isolated fragments or leave artificial gaps between them. Keep major open areas visually quiet while allowing subtle continuous background where needed. Preserve spatial relationships, not exact contours. Subject: '+subject;
  try{await window.openai.sendFollowUpMessage({prompt:instruction});el('status').textContent='Sent to ChatGPT. Waiting for image generation in the conversation.';}
  catch(err){el('status').textContent='Could not send request: '+String(err?.message||err);}
  finally{busy=false;el('submit').disabled=false;}
};
})();
</script></body></html>
